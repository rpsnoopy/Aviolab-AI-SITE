<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 | Aviolab AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #212529;
            background: #F8F9FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .box { text-align: center; max-width: 560px; }
        .code {
            font-size: 96px;
            font-weight: 800;
            color: #FF0000;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 { font-size: 24px; margin-bottom: 12px; }
        p { font-size: 16px; color: #6C757D; margin-bottom: 8px; }
        a.home {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 28px;
            background: #212529;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        a.home:hover { background: #FF0000; }
        .brand { margin-top: 40px; font-size: 13px; color: #ADB5BD; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>
        <h1>Page or resource not found</h1>
        <p>The page or file you requested does not exist on this server.</p>
        <p>La pagina o il file richiesto non esiste su questo server.</p>
        <a class="home" href="/">Aviolab AI — Home</a>
        <div class="brand">&copy; 2026 Aviolab AI — All rights reserved</div>
    </div>
</body>
</html>
